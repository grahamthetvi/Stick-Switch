<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" href="{{ "/assets/css/a11y.css" | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <div class="container-lg px-3 my-5 markdown-body">
      {% if site.title and site.title != page.title %}
      <h1><a href="{{ "/" | absolute_url }}">{{ site.title }}</a></h1>
      {% endif %}

      <main id="main" tabindex="-1">
        {{ content }}
      </main>

      {% if site.github.private != true and site.github.license %}
      <footer class="site-footer border-top border-gray-light mt-5 pt-3 text-right">
        This site is open source. {% github_edit_link "Improve this page" %}.
      </footer>
      {% endif %}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZaRhKri35AyJSypXXs4o6OPFTbTmUoltBbDCbdzegg=" crossorigin="anonymous"></script>
    <script>
      anchors.add();
      document.querySelectorAll(".anchorjs-link").forEach(function (a) {
        var heading = a.parentElement;
        if (!heading) return;
        var text = heading.textContent.replace(a.textContent, "").trim();
        if (text) a.setAttribute("aria-label", "Permalink: " + text);
      });
      (function () {
        var toc = document.getElementById("markdown-toc");
        if (!toc || toc.closest("nav")) return;
        var nav = document.createElement("nav");
        nav.setAttribute("aria-label", "On this page");
        toc.parentNode.insertBefore(nav, toc);
        nav.appendChild(toc);
      })();
    </script>
  </body>
</html>
